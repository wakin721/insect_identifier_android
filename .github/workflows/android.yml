name: Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.8"
  PYTHON_VERSION: "3.12"
  ULTRALYTICS_VERSION: "8.4.104"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"

jobs:
  build-android:
    name: Export model and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-export.txt

      - name: Validate repository inputs
        run: python tool/validate_project.py

      - name: Test calibration dataset builder
        run: python -m unittest test/build_calibration_dataset_test.py

      - name: Restore exported LiteRT model
        id: model-cache
        uses: actions/cache@v5
        with:
          path: |
            assets/models/insect_classifier_fp32.tflite
            assets/models/insect_classifier_w8a16.tflite
          key: litert-dual-v3-calibration-${{ runner.os }}-${{ hashFiles('models/best.pt', 'assets/data/taxonomy_zh.json', 'calibration/**/*', 'tool/export_model.py', 'requirements-export.txt') }}

      - name: Install model export dependencies
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0 torchvision==0.25.0
          python -m pip install -r requirements-export.txt

      - name: Export YOLO classifier to LiteRT
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          python tool/export_model.py \
            --input models/best.pt \
            --output assets/models/insect_classifier_fp32.tflite \
            --quantize fp32 \
            --imgsz 416
          python tool/export_model.py \
            --input models/best.pt \
            --output assets/models/insect_classifier_w8a16.tflite \
            --quantize w8a16 \
            --data calibration \
            --imgsz 416

      - name: Verify exported models exist
        run: |
          test -s assets/models/insect_classifier_fp32.tflite
          test -s assets/models/insect_classifier_w8a16.tflite

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi

      - name: Build release Android App Bundle
        run: flutter build appbundle --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v6
        with:
          name: insect-identifier-android-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/bundle/release/app-release.aab
            assets/models/insect_classifier_fp32.tflite
            assets/models/insect_classifier_w8a16.tflite
